name: Build Debug APK & Publish Release

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify active Java version
        run: java -version

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Verify active Gradle version
        run: gradle --version

      - name: Create temporary debug keystore
        run: |
          rm -f debug.keystore
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Validate built APK
        id: validate_apk
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::Expected APK not found at $APK_PATH"
            exit 1
          fi
          if [ ! -s "$APK_PATH" ]; then
            echo "::error::APK file at $APK_PATH is empty"
            exit 1
          fi
          case "$APK_PATH" in
            *.apk) ;;
            *)
              echo "::error::Release asset is not an .apk file: $APK_PATH"
              exit 1
              ;;
          esac
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "apk_filename=$(basename "$APK_PATH")" >> "$GITHUB_OUTPUT"
          ls -lh "$APK_PATH"

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish GitHub Release with Debug APK
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: app/build/outputs/apk/debug/app-debug.apk
          RELEASE_TAG: debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}
          RELEASE_TITLE: "Debug APK Build #${{ github.run_number }}"
        run: |
          set -euo pipefail

          echo "Checking GitHub CLI availability..."
          gh --version

          if [ ! -f "$APK_PATH" ] || [ ! -s "$APK_PATH" ]; then
            echo "::error::Prepared release asset missing or empty at $APK_PATH"
            exit 1
          fi

          case "$APK_PATH" in
            *.apk) ;;
            *)
              echo "::error::Prepared release asset is not an .apk file: $APK_PATH"
              exit 1
              ;;
          esac

          RELEASE_NOTES=$(cat <<EOF
          - This is an automatically generated debug APK.
          - The APK was built by GitHub Actions.
          - GitHub Actions Run Number: ${{ github.run_number }}
          - GitHub Actions Run Attempt: ${{ github.run_attempt }}
          - Source Commit SHA: ${{ github.sha }}
          - This APK is intended for testing only and is not a Play Store production release.
          - This APK is signed only with a temporary debug keystore.
          EOF
          )

          gh release create "$RELEASE_TAG" "$APK_PATH" \
            --title "$RELEASE_TITLE" \
            --target "${{ github.sha }}" \
            --notes "$RELEASE_NOTES" \
            --latest

      - name: Report APK download result
        if: always() && steps.publish_release.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}
          RELEASE_TITLE: "Debug APK Build #${{ github.run_number }}"
          APK_FILENAME: app-debug.apk
        run: |
          set -euo pipefail
          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            gh release view "$RELEASE_TAG"
            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url -q .url)
            ASSET_NAME=$(gh release view "$RELEASE_TAG" --json assets -q '.assets[0].name // ""')
            if [ -z "$ASSET_NAME" ]; then
              ASSET_NAME="$APK_FILENAME"
            fi

            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_NAME"

            {
              echo "## Debug APK Release Published"
              echo ""
              echo "- **Release Tag:** \`$RELEASE_TAG\`"
              echo "- **Release Title:** $RELEASE_TITLE"
              echo "- **Release Page URL:** $RELEASE_URL"
              echo "- **APK Asset Filename:** \`$ASSET_NAME\`"
              echo ""
              echo "You can download the APK directly from the **Assets** section on the GitHub Release page above."
              echo "The standard GitHub Actions artifact (\`app-debug-apk\`) is also available as a backup."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing failed for tag $RELEASE_TAG. The APK build and Actions artifact upload succeeded; download the APK from the 'app-debug-apk' workflow artifact."
            {
              echo "## Debug APK Build Succeeded (Release Publishing Failed)"
              echo ""
              echo "> **Warning:** GitHub Release publishing failed for tag \`$RELEASE_TAG\`."
              echo ""
              echo "- **APK Build Status:** Succeeded"
              echo "- **Backup Download:** The compiled APK remains available in the GitHub Actions artifact named \`app-debug-apk\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
